<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1b1d1e" />
    <meta name="description" content="Sri Lanka Cricket High Performance Batting Practice Planner, Live Scoring, Wagon Wheel, and Reporting." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Batting Practice" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./slc-logo.png" />
    <link rel="apple-touch-icon" href="./slc-logo.png" />
    <title>Batting Practice Planner | Sri Lanka Cricket</title>
  </head>
  <body class="antialiased">
    <div id="root">
      <style>
        @keyframes slcBootDot {
          0%, 100% { opacity: 0.32; transform: translateY(0) scale(0.82); }
          45% { opacity: 1; transform: translateY(-6px) scale(1.15); }
        }
        @keyframes slcBootLogo {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.04); }
        }
      </style>
      <div
        style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#ffffff;color:#0f172a;font-family:Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;"
      >
        <div style="padding:10px;border-radius:9999px;background:#f8fafc;box-shadow:0 12px 32px rgba(29,78,216,0.10);animation:slcBootLogo 2.2s ease-in-out infinite;">
          <img src="./slc-logo.png" alt="Sri Lanka Cricket" width="58" height="58" style="display:block;border-radius:9999px;" />
        </div>
        <div style="display:flex;align-items:center;gap:10px;height:20px;">
          <span style="width:10px;height:10px;border-radius:9999px;background:#881337;animation:slcBootDot 1.1s cubic-bezier(0.45,0.05,0.55,0.95) 0s infinite;"></span>
          <span style="width:10px;height:10px;border-radius:9999px;background:#1D4ED8;animation:slcBootDot 1.1s cubic-bezier(0.45,0.05,0.55,0.95) 0.15s infinite;"></span>
          <span style="width:10px;height:10px;border-radius:9999px;background:#EAB308;animation:slcBootDot 1.1s cubic-bezier(0.45,0.05,0.55,0.95) 0.30s infinite;"></span>
        </div>
        <span style="font-size:12px;font-weight:600;letter-spacing:0.03em;color:#475569;">
          Loading Batting Practice Planner...
        </span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
